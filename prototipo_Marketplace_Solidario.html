<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Mercado Livre Solidário — Protótipo</title>
<style>
  :root{
    --bg:#F6F4EF;
    --surface:#FFFFFF;
    --border:#DAD4C6;
    --border-strong:#B9B0A0;
    --ink:#26221E;
    --ink-soft:#736C63;
    --ink-faint:#A79E92;
    --accent:#A68D2F;
    --accent-soft:#F1E7C9;
    --oferta:#3F7A5B;
    --oferta-soft:#E1EFE6;
    --demanda:#B5651D;
    --demanda-soft:#F7E6D5;
    --danger:#B23A3A;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    min-height:100vh;
  }
  /* ---- Sidebar ---- */
  #sidebar{
    width:280px;
    flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:24px 16px;
    overflow-y:auto;
  }
  #sidebar h1{
    font-size:15px;
    letter-spacing:0.02em;
    margin:0 0 2px;
  }
  #sidebar .sub{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:20px;
  }
  .group-label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-faint);
    margin:18px 0 6px;
    padding-left:4px;
  }
  .group-label:first-of-type{margin-top:0;}
  .nav-item{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-radius:10px;
    padding:9px 10px;
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
    line-height:1.3;
  }
  .nav-item:hover{background:var(--bg);}
  .nav-item.active{background:var(--accent-soft); color:#5b4b16; font-weight:600;}
  .tag{
    font-size:10px;
    padding:1px 6px;
    border-radius:20px;
    flex-shrink:0;
    font-weight:600;
  }
  .tag.new{background:var(--oferta-soft); color:var(--oferta);}
  .tag.edit{background:var(--accent-soft); color:#8a7326;}
  .tag.same{background:#EDEAE3; color:var(--ink-soft);}

  /* ---- Main / phone ---- */
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    gap:18px;
  }
  #flowbar{
    display:flex;
    gap:8px;
    align-items:center;
  }
  #flowbar button{
    border:1px solid var(--border-strong);
    background:var(--surface);
    border-radius:20px;
    padding:8px 16px;
    font-size:13px;
    cursor:pointer;
    color:var(--ink);
  }
  #flowbar button:disabled{opacity:0.35; cursor:default;}
  #flowbar span{font-size:12px; color:var(--ink-soft);}

  .phone{
    width:340px;
    height:700px;
    background:var(--surface);
    border:8px solid var(--ink);
    border-radius:38px;
    overflow:hidden;
    position:relative;
    box-shadow:0 20px 50px rgba(38,34,30,0.15);
  }
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:110px; height:20px; background:var(--ink); border-radius:0 0 14px 14px; z-index:5;
  }
  .screen{display:none; height:100%; flex-direction:column; overflow-y:auto;}
  .screen.active{display:flex;}
  .screen-inner{padding:38px 18px 18px; flex:1; display:flex; flex-direction:column; gap:14px;}
  .status-badge{
    align-self:flex-start;
    font-size:10px;
    padding:2px 8px;
    border-radius:20px;
    font-weight:600;
    margin-bottom:-4px;
  }
  .status-badge.new{background:var(--oferta-soft); color:var(--oferta);}
  .status-badge.edit{background:var(--accent-soft); color:#8a7326;}
  .status-badge.same{background:#EDEAE3; color:var(--ink-soft);}

  h2.screen-title{font-size:17px; margin:0;}
  p.screen-obj{font-size:11.5px; color:var(--ink-soft); margin:0 0 4px;}

  .logo-diamond{
    width:58px; height:58px; border:2px solid var(--ink); transform:rotate(45deg);
    margin:10px auto; flex-shrink:0;
  }
  .field{
    border:1px solid var(--border-strong);
    border-radius:10px;
    padding:11px 12px;
    font-size:13px;
    color:var(--ink-soft);
    background:var(--surface);
  }
  .btn{
    border:none;
    border-radius:10px;
    padding:12px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    text-align:center;
  }
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-accent{background:var(--accent); color:#fff;}
  .btn-outline{background:none; border:1px solid var(--border-strong); color:var(--ink);}
  .link{font-size:12.5px; color:var(--accent); text-align:center; cursor:pointer;}
  .hint{font-size:10.5px; color:var(--ink-faint); line-height:1.4;}

  .profile-dot{
    width:30px; height:30px; border-radius:50%; border:2px solid var(--ink);
    position:absolute; top:38px; right:18px;
  }
  .topbar{display:flex; justify-content:space-between; align-items:center;}

  /* map */
  .map{
    flex:1; background:repeating-linear-gradient(0deg, #EFEBE1 0 1px, transparent 1px 26px),
      repeating-linear-gradient(90deg, #EFEBE1 0 1px, transparent 1px 26px);
    background-color:#F8F6F0;
    border:1px solid var(--border);
    border-radius:12px;
    position:relative;
    min-height:340px;
  }
  .pin{position:absolute; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,0.25); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .pin.oferta{background:var(--oferta); border-radius:50%;}
  .pin.demanda{background:var(--demanda); border-radius:5px; transform:rotate(45deg);}
  .pin.demanda .pin-ic{transform:rotate(-45deg); display:block;}
  .pin-ic{color:#fff; font-size:9px; line-height:1; font-weight:700;}
  .cluster{
    position:absolute; width:30px; height:30px; border-radius:50%;
    background:var(--ink); color:#fff; font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center; border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,0.25); cursor:pointer;
  }
  .filters{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{font-size:10.5px; border:1px solid var(--border-strong); border-radius:20px; padding:4px 10px; color:var(--ink-soft);}
  .segmented{display:flex; border:1px solid var(--border-strong); border-radius:20px; overflow:hidden; font-size:11px;}
  .segmented button{flex:1; border:none; background:var(--surface); padding:7px 4px; cursor:pointer; color:var(--ink-soft);}
  .segmented button.active{background:var(--ink); color:#fff;}
  .legend{display:flex; gap:14px; font-size:10.5px; color:var(--ink-soft);}
  .legend span{display:flex; align-items:center; gap:5px;}
  .legend i{width:9px; height:9px; display:inline-block;}
  .legend i.circ{border-radius:50%; background:var(--oferta);}
  .legend i.diam{border-radius:2px; background:var(--demanda); transform:rotate(45deg);}

  /* bottom sheet */
  .sheet-backdrop{
    position:absolute; inset:0; background:rgba(38,34,30,0.35);
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:10;
  }
  .sheet-backdrop.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:absolute; left:0; right:0; bottom:0;
    background:var(--surface); border-radius:20px 20px 0 0;
    padding:10px 18px 20px; box-shadow:0 -8px 24px rgba(0,0,0,0.15);
    transform:translateY(100%); transition:transform .25s ease; z-index:11;
    display:flex; flex-direction:column; gap:8px;
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; background:var(--border-strong); border-radius:4px; margin:0 auto 6px;}
  .sheet-type{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;}
  .sheet-type.oferta{color:var(--oferta);}
  .sheet-type.demanda{color:var(--demanda);}
  .sheet-row{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-soft);}

  /* items grid */
  .cat-row{display:flex; gap:8px; overflow-x:auto;}
  .cat-pill{flex-shrink:0; font-size:11px; border:1px solid var(--border-strong); border-radius:20px; padding:6px 12px;}
  .search{display:flex; align-items:center; gap:6px; border:1px solid var(--border-strong); border-radius:10px; padding:8px 12px; font-size:12px; color:var(--ink-faint);}
  .items-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .item-card{
    border:1px solid var(--border-strong); border-radius:12px; height:88px;
    display:flex; align-items:flex-end; padding:6px; font-size:10.5px; position:relative; background:var(--surface);
  }
  .flag{position:absolute; top:6px; right:6px; background:var(--demanda); color:#fff; font-size:9px; padding:2px 6px; border-radius:10px; font-weight:700;}

  /* forms */
  .urgency-row{display:flex; gap:6px;}
  .urgency-opt{flex:1; text-align:center; border:1px solid var(--border-strong); border-radius:10px; padding:8px 0; font-size:11.5px;}
  .urgency-opt.high{background:var(--demanda-soft); border-color:var(--demanda); color:var(--demanda); font-weight:700;}
  .upload-box{border:1.5px dashed var(--border-strong); border-radius:12px; height:90px; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-faint);}

  /* carrinho */
  .cart-line{display:flex; justify-content:space-between; align-items:center; border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:12.5px;}
  .cart-total{display:flex; justify-content:space-between; font-size:13px; font-weight:700; padding-top:6px; border-top:1px solid var(--border);}

  /* processing */
  .center-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center;}
  .spinner{width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .check-circle{width:56px; height:56px; border-radius:50%; background:var(--oferta-soft); color:var(--oferta); display:flex; align-items:center; justify-content:center; font-size:28px;}
  .error-circle{width:56px; height:56px; border-radius:50%; background:#F7E3E3; color:var(--danger); display:flex; align-items:center; justify-content:center; font-size:24px;}
  .toggle-row{display:flex; gap:6px; justify-content:center; margin-top:6px;}
  .toggle-row button{font-size:10.5px; border:1px solid var(--border-strong); background:none; border-radius:20px; padding:4px 10px; cursor:pointer; color:var(--ink-soft);}
  .toggle-row button.on{background:var(--ink); color:#fff; border-color:var(--ink);}

  /* qr */
  .tabs{display:flex; border:1px solid var(--border-strong); border-radius:20px; overflow:hidden;}
  .tabs button{flex:1; padding:8px; font-size:12px; background:var(--surface); border:none; cursor:pointer; color:var(--ink-soft);}
  .tabs button.active{background:var(--ink); color:#fff;}
  .qr-box{
    width:170px; height:170px; margin:14px auto; align-self:center;
    background:repeating-conic-gradient(var(--ink) 0% 25%, transparent 0% 50%) 0 0/16px 16px;
    border:1px solid var(--border-strong); border-radius:10px;
  }
  .cam-box{
    width:200px; height:170px; margin:14px auto; align-self:center;
    border:2px solid var(--ink); border-radius:14px; position:relative;
  }
  .cam-box::after{content:"◻"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:60px; color:var(--border-strong);}

  /* perfil */
  .avatar{width:56px; height:56px; border-radius:50%; border:2px solid var(--ink); margin:0 auto;}
  .score-bar{height:8px; border-radius:20px; background:var(--border); overflow:hidden;}
  .score-fill{height:100%; width:82%; background:var(--oferta);}
  .hist-line{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-soft); border-bottom:1px solid var(--border); padding:6px 0;}

  /* notif */
  .notif{display:flex; gap:10px; border-bottom:1px solid var(--border); padding:10px 0;}
  .notif .dot{width:8px; height:8px; border-radius:50%; background:var(--accent); margin-top:5px; flex-shrink:0;}
  .notif .txt{font-size:12px; line-height:1.4;}
  .notif .time{font-size:10px; color:var(--ink-faint);}
</style>
</head>
<body>

<div id="sidebar">
  <h1>Mercado Livre Solidário</h1>
  <div class="sub">Rascunho de protótipo — 13 telas</div>
  <div id="nav"></div>
</div>

<div id="main">
  <div id="flowbar">
    <button id="prevBtn">← Anterior</button>
    <span id="flowLabel"></span>
    <button id="nextBtn">Próxima →</button>
  </div>
  <div class="phone">
    <div class="notch"></div>
    <div id="screens"></div>
  </div>
</div>

<script>
const SCREENS = [
  {id:'login', name:'Login', status:'same', group:'Onboarding'},
  {id:'cadastro', name:'Cadastro', status:'edit', group:'Onboarding'},
  {id:'mapa', name:'Mapa compartilhado', status:'edit', group:'Descoberta'},
  {id:'itens', name:'Itens do ponto', status:'same', group:'Descoberta'},
  {id:'publicar-item', name:'Publicar item', status:'new', group:'Publicação'},
  {id:'publicar-necessidade', name:'Publicar necessidade', status:'new', group:'Publicação'},
  {id:'carrinho', name:'Carrinho', status:'edit', group:'Reserva e retirada'},
  {id:'processando', name:'Processando reserva', status:'edit', group:'Reserva e retirada'},
  {id:'qr', name:'QR Code', status:'edit', group:'Reserva e retirada'},
  {id:'confirmacao', name:'Confirmação de retirada', status:'new', group:'Reserva e retirada'},
  {id:'comprovante', name:'Comprovante de doação', status:'new', group:'Reserva e retirada'},
  {id:'perfil', name:'Perfil / Histórico', status:'new', group:'Perfil'},
  {id:'notificacoes', name:'Notificações', status:'new', group:'Perfil'},
];
const STATUS_LABEL = {same:'igual', edit:'ajustada', new:'nova'};

let current = 0;

function buildNav(){
  const nav = document.getElementById('nav');
  let lastGroup = null;
  SCREENS.forEach((s, i) => {
    if(s.group !== lastGroup){
      const label = document.createElement('div');
      label.className = 'group-label';
      label.textContent = s.group;
      nav.appendChild(label);
      lastGroup = s.group;
    }
    const btn = document.createElement('button');
    btn.className = 'nav-item';
    btn.id = 'nav-' + i;
    btn.innerHTML = `<span class="tag ${s.status}">${STATUS_LABEL[s.status]}</span> ${s.name}`;
    btn.onclick = () => goTo(i);
    nav.appendChild(btn);
  });
}

function goTo(i){
  current = i;
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById('screen-' + SCREENS[i].id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('nav-' + i).classList.add('active');
  document.getElementById('flowLabel').textContent = (i+1) + ' / ' + SCREENS.length + ' — ' + SCREENS[i].name;
  document.getElementById('prevBtn').disabled = i === 0;
  document.getElementById('nextBtn').disabled = i === SCREENS.length - 1;
}

function badge(s){
  return `<div class="status-badge ${s}">${STATUS_LABEL[s]}</div>`;
}

document.getElementById('prevBtn').onclick = () => goTo(Math.max(0, current-1));
document.getElementById('nextBtn').onclick = () => goTo(Math.min(SCREENS.length-1, current+1));

function showProc(state){
  document.getElementById('proc-loading').style.display = state==='loading' ? 'flex' : 'none';
  document.getElementById('proc-success').style.display = state==='success' ? 'flex' : 'none';
  document.getElementById('proc-error').style.display = state==='error' ? 'flex' : 'none';
  document.querySelectorAll('#screen-processando .toggle-row button').forEach(b=>b.classList.remove('on'));
  document.getElementById('proc-btn-'+state).classList.add('on');
}
function showQr(state){
  document.getElementById('qr-mine').style.display = state==='mine' ? 'block' : 'none';
  document.getElementById('qr-scan').style.display = state==='scan' ? 'block' : 'none';
  document.querySelectorAll('#screen-qr .tabs button').forEach(b=>b.classList.remove('active'));
  document.getElementById('qr-btn-'+state).classList.add('active');
}

function openSheet(type){
  document.getElementById('sheetOferta').style.display = type==='oferta' ? 'flex' : 'none';
  document.getElementById('sheetDemanda').style.display = type==='demanda' ? 'flex' : 'none';
  document.getElementById('sheet').classList.add('open');
  document.getElementById('sheetBackdrop').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('sheetBackdrop').classList.remove('open');
}
function filterMap(type){
  document.querySelectorAll('.segmented button').forEach(b => b.classList.toggle('active', b.dataset.f===type));
  document.querySelectorAll('#mapArea .pin, #mapArea .cluster').forEach(p => {
    p.style.display = (type==='tudo' || p.dataset.t===type) ? 'flex' : 'none';
  });
}

document.getElementById('screens').innerHTML = `

<div class="screen active" id="screen-login">
  <div class="screen-inner">
    ${badge('same')}
    <h2 class="screen-title">Login</h2>
    <p class="screen-obj">Autenticar qualquer perfil — mesmo formulário serve doador e instituição.</p>
    <div class="logo-diamond"></div>
    <div class="field">CPF ou CNPJ</div>
    <div class="field">Senha</div>
    <div class="btn btn-primary" onclick="goTo(1)">Entrar</div>
    <div class="link" onclick="goTo(1)">Criar cadastro</div>
  </div>
</div>

<div class="screen" id="screen-cadastro">
  <div class="screen-inner">
    ${badge('edit')}
    <h2 class="screen-title">Cadastro</h2>
    <p class="screen-obj">Ajuste: inclui endereço e janela de disponibilidade (decisão sobre retirada sem contato direto).</p>
    <div class="field">Nome</div>
    <div class="field">CPF ou CNPJ</div>
    <div class="field">Endereço (ponto de coleta)</div>
    <div class="hint">Se CPF: escolha janelas — manhã / tarde / fim de semana. O sistema usa isso pra sugerir horário sem precisar combinar.</div>
    <div class="field">Senha</div>
    <div class="field">Confirmar senha</div>
    <div class="btn btn-primary" onclick="goTo(2)">Registrar</div>
  </div>
</div>

<div class="screen" id="screen-mapa">
  <div class="screen-inner" style="position:relative;">
    ${badge('edit')}
    <div class="topbar"><h2 class="screen-title">Mapa compartilhado</h2></div>
    <p class="screen-obj">Ajuste: filtro por tipo de ponto + forma do pin (não só cor), pra acessibilidade.</p>
    <div class="segmented">
      <button class="active" data-f="tudo" onclick="filterMap('tudo')">Tudo</button>
      <button data-f="oferta" onclick="filterMap('oferta')">Disponível</button>
      <button data-f="demanda" onclick="filterMap('demanda')">Necessário</button>
    </div>
    <div class="filters">
      <div class="chip">Raio: 10km</div>
      <div class="chip">Categoria</div>
    </div>
    <div class="legend">
      <span><i class="circ"></i>Item disponível</span>
      <span><i class="diam"></i>Necessidade</span>
    </div>
    <div class="map" id="mapArea">
      <div class="pin oferta" data-t="oferta" style="width:16px;height:16px;top:40px;left:50px" onclick="openSheet('oferta')"></div>
      <div class="pin demanda" data-t="demanda" style="width:24px;height:24px;top:90px;left:150px" onclick="openSheet('demanda')"><span class="pin-ic">!</span></div>
      <div class="pin oferta" data-t="oferta" style="width:14px;height:14px;top:180px;left:220px" onclick="openSheet('oferta')"></div>
      <div class="pin demanda" data-t="demanda" style="width:16px;height:16px;top:230px;left:70px" onclick="openSheet('demanda')"><span class="pin-ic">!</span></div>
      <div class="pin oferta" data-t="oferta" style="width:20px;height:20px;top:270px;left:180px" onclick="openSheet('oferta')"></div>
      <div class="cluster" data-t="oferta" style="top:150px;left:250px" onclick="filterMap('oferta')">+5</div>
    </div>
    <span class="hint">Muitos pins próximos viram um agrupador (+5) — evita poluição visual ao dar zoom out.</span>

    <div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet()"></div>
    <div class="sheet" id="sheet">
      <div class="sheet-handle"></div>
      <div id="sheetOferta" style="display:none; flex-direction:column; gap:8px;">
        <span class="sheet-type oferta">Item disponível</span>
        <strong style="font-size:14px;">Mercado São José</strong>
        <div class="sheet-row"><span>Itens</span><span>Arroz, feijão, óleo</span></div>
        <div class="sheet-row"><span>Distância</span><span>1,4 km</span></div>
        <div class="sheet-row"><span>Horário</span><span>8h – 18h</span></div>
        <div class="sheet-row"><span>Endereço</span><span>Rua das Flores, 120</span></div>
        <div class="btn btn-accent" onclick="closeSheet(); goTo(3)">Quero retirar este item</div>
      </div>
      <div id="sheetDemanda" style="display:none; flex-direction:column; gap:8px;">
        <span class="sheet-type demanda">Necessidade</span>
        <strong style="font-size:14px;">Abrigo Vida Nova</strong>
        <div class="sheet-row"><span>Item necessário</span><span>Cesta básica</span></div>
        <div class="sheet-row"><span>Quantidade</span><span>12 unidades</span></div>
        <div class="sheet-row"><span>Urgência</span><span style="color:var(--demanda); font-weight:700;">Alta</span></div>
        <div class="sheet-row"><span>Distância</span><span>1,4 km</span></div>
        <div class="sheet-row"><span>Endereço</span><span>Av. Central, 45</span></div>
        <div class="btn btn-accent" onclick="closeSheet(); goTo(6)">Quero doar este item</div>
      </div>
    </div>
  </div>
</div>

<div class="screen" id="screen-itens">
  <div class="screen-inner">
    ${badge('same')}
    <div class="topbar"><h2 class="screen-title">Itens do ponto</h2></div>
    <div class="cat-row">
      <div class="cat-pill">Alimento</div><div class="cat-pill">Roupa</div><div class="cat-pill">Móvel</div><div class="cat-pill">Eletro</div>
    </div>
    <div class="search">🔍 Buscar item</div>
    <div class="items-grid">
      <div class="item-card">Arroz 5kg <span class="flag">urgente</span></div>
      <div class="item-card">Feijão 2kg</div>
      <div class="item-card">Óleo 900ml</div>
      <div class="item-card">Leite <span class="flag">urgente</span></div>
    </div>
    <div class="btn btn-primary" onclick="goTo(6)">Ver carrinho</div>
  </div>
</div>

<div class="screen" id="screen-publicar-item">
  <div class="screen-inner">
    ${badge('new')}
    <h2 class="screen-title">Publicar item</h2>
    <p class="screen-obj">Faltava no wireframe — sem isso, nada entra no mapa.</p>
    <div class="upload-box">+ Adicionar foto</div>
    <div class="field">Categoria</div>
    <div class="field">Quantidade</div>
    <div class="field">Descrição breve</div>
    <div class="btn btn-accent">Publicar item</div>
  </div>
</div>

<div class="screen" id="screen-publicar-necessidade">
  <div class="screen-inner">
    ${badge('new')}
    <h2 class="screen-title">Publicar necessidade</h2>
    <p class="screen-obj">A "vitrine de necessidade" — qualquer perfil pode declarar o que precisa.</p>
    <div class="field">O que você precisa?</div>
    <div class="field">Quantidade</div>
    <span class="hint">Urgência</span>
    <div class="urgency-row">
      <div class="urgency-opt">Baixa</div>
      <div class="urgency-opt">Média</div>
      <div class="urgency-opt high">Alta</div>
    </div>
    <div class="btn btn-accent">Publicar necessidade</div>
  </div>
</div>

<div class="screen" id="screen-carrinho">
  <div class="screen-inner">
    ${badge('edit')}
    <h2 class="screen-title">Carrinho</h2>
    <p class="screen-obj">Ajuste: sempre um único ponto de doação por reserva.</p>
    <span class="hint">Ponto: Mercado São José</span>
    <div class="cart-line"><span>Arroz 5kg</span><span>x1</span></div>
    <div class="cart-line"><span>Leite</span><span>x2</span></div>
    <div class="cart-total"><span>Total de itens</span><span>3</span></div>
    <div class="btn btn-primary" onclick="goTo(7); showProc('loading')">Confirmar</div>
  </div>
</div>

<div class="screen" id="screen-processando">
  <div class="screen-inner">
    ${badge('edit')}
    <h2 class="screen-title">Processando reserva</h2>
    <p class="screen-obj">Substitui "Aguardo de resposta" — automático, sem aprovação humana.</p>
    <div class="toggle-row">
      <button id="proc-btn-loading" onclick="showProc('loading')">Carregando</button>
      <button id="proc-btn-success" onclick="showProc('success')">Sucesso</button>
      <button id="proc-btn-error" onclick="showProc('error')">Erro</button>
    </div>
    <div class="center-col" id="proc-loading">
      <div class="spinner"></div>
      <span style="font-size:13px;">Confirmando sua reserva...</span>
    </div>
    <div class="center-col" id="proc-success" style="display:none">
      <div class="check-circle">✓</div>
      <span style="font-size:13px;">Reserva confirmada!</span>
      <div class="btn btn-primary" onclick="goTo(8); showQr('mine')">Ver QR Code</div>
    </div>
    <div class="center-col" id="proc-error" style="display:none">
      <div class="error-circle">!</div>
      <span style="font-size:13px;">Esse item já foi reservado por outra pessoa</span>
      <div class="btn btn-outline" onclick="goTo(3)">Voltar aos itens</div>
    </div>
  </div>
</div>

<div class="screen" id="screen-qr">
  <div class="screen-inner">
    ${badge('edit')}
    <h2 class="screen-title">QR Code</h2>
    <p class="screen-obj">Quem retira exibe · quem doa lê, pra confirmar que é o reservante legítimo.</p>
    <div class="tabs">
      <button id="qr-btn-mine" class="active" onclick="showQr('mine')">Meu código</button>
      <button id="qr-btn-scan" onclick="showQr('scan')">Ler código</button>
    </div>
    <div id="qr-mine">
      <div class="qr-box"></div>
      <span class="hint" style="display:block;text-align:center">Mostre este código a quem está doando</span>
    </div>
    <div id="qr-scan" style="display:none">
      <div class="cam-box"></div>
      <span class="hint" style="display:block;text-align:center">Aponte a câmera para o código de quem retira</span>
    </div>
    <div class="btn btn-primary" onclick="goTo(9)">Simular leitura</div>
  </div>
</div>

<div class="screen" id="screen-confirmacao">
  <div class="screen-inner">
    ${badge('new')}
    <div class="center-col">
      ${badge('new')}
      <div class="check-circle">✓</div>
      <h2 class="screen-title">Retirada confirmada</h2>
      <span class="hint">Score de confiabilidade atualizado</span>
      <div class="score-bar" style="width:180px;"><div class="score-fill"></div></div>
      <div class="btn btn-primary" onclick="goTo(10)">Ver comprovante (PJ)</div>
      <div class="link" onclick="goTo(0)">Voltar ao início</div>
    </div>
  </div>
</div>

<div class="screen" id="screen-comprovante">
  <div class="screen-inner">
    ${badge('new')}
    <h2 class="screen-title">Comprovante de doação</h2>
    <p class="screen-obj">Só aparece pra doador PJ — uso contábil/ESG, dedução fiscal quando aplicável.</p>
    <div style="border:1px solid var(--border-strong); border-radius:12px; height:180px; display:flex; align-items:center; justify-content:center; color:var(--ink-faint); font-size:12px;">
      Prévia do comprovante (PDF)
    </div>
    <div class="btn btn-accent">Baixar comprovante</div>
  </div>
</div>

<div class="screen" id="screen-perfil">
  <div class="screen-inner">
    ${badge('new')}
    <div class="avatar"></div>
    <h2 class="screen-title" style="text-align:center">Gabriel</h2>
    <span class="hint" style="text-align:center">Score de confiabilidade</span>
    <div class="score-bar"><div class="score-fill"></div></div>
    <div class="hist-line"><span>Arroz 5kg — retirado</span><span>12/08</span></div>
    <div class="hist-line"><span>Cesta básica — publicada</span><span>05/08</span></div>
    <div class="btn btn-outline">Editar janelas de disponibilidade</div>
  </div>
</div>

<div class="screen" id="screen-notificacoes">
  <div class="screen-inner">
    ${badge('new')}
    <h2 class="screen-title">Notificações</h2>
    <p class="screen-obj">Substitui o contato direto por avisos automáticos.</p>
    <div class="notif"><div class="dot"></div><div class="txt">Necessidade compatível surgiu a 1,2 km de você<div class="time">2h atrás</div></div></div>
    <div class="notif"><div class="dot"></div><div class="txt">Sua reserva foi confirmada — retire até sexta<div class="time">1d atrás</div></div></div>
    <div class="notif"><div class="dot"></div><div class="txt">Comprovante de doação disponível<div class="time">3d atrás</div></div></div>
  </div>
</div>
`;

buildNav();
goTo(0);
</script>

</body>
</html>
