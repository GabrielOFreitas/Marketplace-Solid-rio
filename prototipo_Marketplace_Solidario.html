<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Mercado Livre Solidário — Protótipo</title>
<style>
  :root{
    --bg:#F6F4EF;
    --surface:#FFFFFF;
    --border:#DAD4C6;
    --border-strong:#B9B0A0;
    --ink:#26221E;
    --ink-soft:#736C63;
    --ink-faint:#A79E92;
    --accent:#A68D2F;
    --accent-soft:#F1E7C9;
    --oferta:#3F7A5B;
    --oferta-soft:#E1EFE6;
    --demanda:#B5651D;
    --demanda-soft:#F7E6D5;
    --danger:#B23A3A;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    min-height:100vh;
  }
  /* ---- Sidebar ---- */
  #sidebar{
    width:280px;
    flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:24px 16px;
    overflow-y:auto;
  }
  #sidebar h1{
    font-size:15px;
    letter-spacing:0.02em;
    margin:0 0 2px;
  }
  #sidebar .sub{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:20px;
  }
  .group-label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-faint);
    margin:18px 0 6px;
    padding-left:4px;
  }
  .group-label:first-of-type{margin-top:0;}
  .nav-item{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-radius:10px;
    padding:9px 10px;
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
    line-height:1.3;
  }
  .nav-item:hover{background:var(--bg);}
  .nav-item.active{background:var(--accent-soft); color:#5b4b16; font-weight:600;}
  .tag{
    font-size:10px;
    padding:1px 6px;
    border-radius:20px;
    flex-shrink:0;
    font-weight:600;
  }
  .tag.new{background:var(--oferta-soft); color:var(--oferta);}
  .tag.edit{background:var(--accent-soft); color:#8a7326;}
  .tag.same{background:#EDEAE3; color:var(--ink-soft);}

  /* ---- Main / phone ---- */
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    gap:18px;
  }
  #flowbar{
    display:flex;
    gap:8px;
    align-items:center;
  }
  #flowbar button{
    border:1px solid var(--border-strong);
    background:var(--surface);
    border-radius:20px;
    padding:8px 16px;
    font-size:13px;
    cursor:pointer;
    color:var(--ink);
  }
  #flowbar button:disabled{opacity:0.35; cursor:default;}
  #flowbar span{font-size:12px; color:var(--ink-soft);}

  .phone{
    width:340px;
    height:700px;
    background:var(--surface);
    border:8px solid var(--ink);
    border-radius:38px;
    overflow:hidden;
    position:relative;
    box-shadow:0 20px 50px rgba(38,34,30,0.15);
  }
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:110px; height:20px; background:var(--ink); border-radius:0 0 14px 14px; z-index:5;
  }
  .screen{display:none; height:100%; flex-direction:column; overflow-y:auto;}
  .screen.active{display:flex;}
  .screen-inner{padding:38px 18px 18px; flex:1; display:flex; flex-direction:column; gap:14px;}
  .status-badge{
    align-self:flex-start;
    font-size:10px;
    padding:2px 8px;
    border-radius:20px;
    font-weight:600;
    margin-bottom:-4px;
  }
  .status-badge.new{background:var(--oferta-soft); color:var(--oferta);}
  .status-badge.edit{background:var(--accent-soft); color:#8a7326;}
  .status-badge.same{background:#EDEAE3; color:var(--ink-soft);}

  h2.screen-title{font-size:17px; margin:0;}
  p.screen-obj{font-size:11.5px; color:var(--ink-soft); margin:0 0 4px;}

  .logo-diamond{
    width:58px; height:58px; border:2px solid var(--ink); transform:rotate(45deg);
    margin:10px auto; flex-shrink:0;
  }
  .field{
    border:1px solid var(--border-strong);
    border-radius:10px;
    padding:11px 12px;
    font-size:13px;
    color:var(--ink-soft);
    background:var(--surface);
    width:100%;
    font-family:inherit;
  }
  .field::placeholder{color:var(--ink-soft);}
  .urgency-opt{cursor:pointer;}
  .urgency-opt.selected{background:var(--demanda-soft); border-color:var(--demanda); color:var(--demanda); font-weight:700;}
  .btn{
    border:none;
    border-radius:10px;
    padding:12px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    text-align:center;
  }
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-accent{background:var(--accent); color:#fff;}
  .btn-outline{background:none; border:1px solid var(--border-strong); color:var(--ink);}
  .link{font-size:12.5px; color:var(--accent); text-align:center; cursor:pointer;}
  .hint{font-size:10.5px; color:var(--ink-faint); line-height:1.4;}

  .profile-dot{
    width:30px; height:30px; border-radius:50%; border:2px solid var(--ink);
    position:absolute; top:38px; right:18px;
  }
  .topbar{display:flex; justify-content:space-between; align-items:center;}

  /* map */
  .map{
    flex:1; background:repeating-linear-gradient(0deg, #EFEBE1 0 1px, transparent 1px 26px),
      repeating-linear-gradient(90deg, #EFEBE1 0 1px, transparent 1px 26px);
    background-color:#F8F6F0;
    border:1px solid var(--border);
    border-radius:12px;
    position:relative;
    min-height:340px;
  }
  .pin{position:absolute; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,0.25); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .pin.oferta{background:var(--oferta); border-radius:50%;}
  .pin.demanda{background:var(--demanda); border-radius:5px; transform:rotate(45deg);}
  .pin.demanda .pin-ic{transform:rotate(-45deg); display:block;}
  .pin-ic{color:#fff; font-size:9px; line-height:1; font-weight:700;}
  .cluster{
    position:absolute; width:30px; height:30px; border-radius:50%;
    background:var(--ink); color:#fff; font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center; border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,0.25); cursor:pointer;
  }
  .filters{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{font-size:10.5px; border:1px solid var(--border-strong); border-radius:20px; padding:4px 10px; color:var(--ink-soft);}
  .segmented{display:flex; border:1px solid var(--border-strong); border-radius:20px; overflow:hidden; font-size:11px;}
  .segmented button{flex:1; border:none; background:var(--surface); padding:7px 4px; cursor:pointer; color:var(--ink-soft);}
  .segmented button.active{background:var(--ink); color:#fff;}
  .legend{display:flex; gap:14px; font-size:10.5px; color:var(--ink-soft);}
  .legend span{display:flex; align-items:center; gap:5px;}
  .legend i{width:9px; height:9px; display:inline-block;}
  .legend i.circ{border-radius:50%; background:var(--oferta);}
  .legend i.diam{border-radius:2px; background:var(--demanda); transform:rotate(45deg);}

  /* bottom sheet */
  .sheet-backdrop{
    position:absolute; inset:0; background:rgba(38,34,30,0.35);
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:10;
  }
  .sheet-backdrop.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:absolute; left:0; right:0; bottom:0;
    background:var(--surface); border-radius:20px 20px 0 0;
    padding:10px 18px 20px; box-shadow:0 -8px 24px rgba(0,0,0,0.15);
    transform:translateY(100%); transition:transform .25s ease; z-index:11;
    display:flex; flex-direction:column; gap:8px;
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; background:var(--border-strong); border-radius:4px; margin:0 auto 6px;}
  .sheet-type{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;}
  .sheet-type.oferta{color:var(--oferta);}
  .sheet-type.demanda{color:var(--demanda);}
  .sheet-row{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-soft);}

  /* items grid */
  .cat-row{display:flex; gap:8px; overflow-x:auto;}
  .cat-pill{flex-shrink:0; font-size:11px; border:1px solid var(--border-strong); border-radius:20px; padding:6px 12px;}
  .search{display:flex; align-items:center; gap:6px; border:1px solid var(--border-strong); border-radius:10px; padding:8px 12px; font-size:12px; color:var(--ink-faint);}
  .items-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .item-card{
    border:1px solid var(--border-strong); border-radius:12px; height:88px;
    display:flex; align-items:flex-end; padding:6px; font-size:10.5px; position:relative; background:var(--surface);
  }
  .flag{position:absolute; top:6px; right:6px; background:var(--demanda); color:#fff; font-size:9px; padding:2px 6px; border-radius:10px; font-weight:700;}
  .qty-btn{width:22px; height:22px; border-radius:50%; border:1px solid var(--border-strong); background:var(--surface); cursor:pointer; font-size:13px; line-height:1; color:var(--ink);}
  .qty-btn:disabled{opacity:0.3; cursor:default;}

  /* forms */
  .urgency-row{display:flex; gap:6px;}
  .urgency-opt{flex:1; text-align:center; border:1px solid var(--border-strong); border-radius:10px; padding:8px 0; font-size:11.5px;}
  .urgency-opt.high{background:var(--demanda-soft); border-color:var(--demanda); color:var(--demanda); font-weight:700;}
  .upload-box{border:1.5px dashed var(--border-strong); border-radius:12px; height:90px; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-faint);}

  /* carrinho */
  .cart-line{display:flex; justify-content:space-between; align-items:center; border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:12.5px;}
  .cart-total{display:flex; justify-content:space-between; font-size:13px; font-weight:700; padding-top:6px; border-top:1px solid var(--border);}

  /* processing */
  .center-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center;}
  .spinner{width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .check-circle{width:56px; height:56px; border-radius:50%; background:var(--oferta-soft); color:var(--oferta); display:flex; align-items:center; justify-content:center; font-size:28px;}
  .error-circle{width:56px; height:56px; border-radius:50%; background:#F7E3E3; color:var(--danger); display:flex; align-items:center; justify-content:center; font-size:24px;}
  .toggle-row{display:flex; gap:6px; justify-content:center; margin-top:6px;}
  .toggle-row button{font-size:10.5px; border:1px solid var(--border-strong); background:none; border-radius:20px; padding:4px 10px; cursor:pointer; color:var(--ink-soft);}
  .toggle-row button.on{background:var(--ink); color:#fff; border-color:var(--ink);}

  /* qr */
  .tabs{display:flex; border:1px solid var(--border-strong); border-radius:20px; overflow:hidden;}
  .tabs button{flex:1; padding:8px; font-size:12px; background:var(--surface); border:none; cursor:pointer; color:var(--ink-soft);}
  .tabs button.active{background:var(--ink); color:#fff;}
  .qr-box{
    width:170px; height:170px; margin:14px auto; align-self:center;
    background:repeating-conic-gradient(var(--ink) 0% 25%, transparent 0% 50%) 0 0/16px 16px;
    border:1px solid var(--border-strong); border-radius:10px;
  }
  .cam-box{
    width:200px; height:170px; margin:14px auto; align-self:center;
    border:2px solid var(--ink); border-radius:14px; position:relative;
  }
  .cam-box::after{content:"◻"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:60px; color:var(--border-strong);}

  /* perfil */
  .avatar{width:56px; height:56px; border-radius:50%; border:2px solid var(--ink); margin:0 auto;}
  .score-bar{height:8px; border-radius:20px; background:var(--border); overflow:hidden;}
  .score-fill{height:100%; width:82%; background:var(--oferta);}
  .hist-line{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-soft); border-bottom:1px solid var(--border); padding:6px 0;}

  /* notif */
  .notif{display:flex; gap:10px; border-bottom:1px solid var(--border); padding:10px 0;}
  .notif .dot{width:8px; height:8px; border-radius:50%; background:var(--accent); margin-top:5px; flex-shrink:0;}
  .notif .txt{font-size:12px; line-height:1.4;}
  .notif .time{font-size:10px; color:var(--ink-faint);}
  .log-panel{margin-top:22px; border-top:1px solid var(--border-strong); padding-top:14px;}
  .log-title{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:8px;}
  #eventLog{display:flex; flex-direction:column; gap:6px; max-height:260px; overflow-y:auto;}
  .log-line{font-size:11px; line-height:1.4; padding:6px 8px; border-radius:8px; background:var(--surface); border:1px solid var(--border-strong);}
  .log-line .log-time{color:var(--ink-faint); font-size:9.5px; display:block; margin-bottom:2px;}
  .log-line.ok{border-color:var(--oferta); color:var(--oferta);}
  .log-line.warn{border-color:var(--demanda); color:var(--demanda);}
  .log-line.err{border-color:var(--danger); color:var(--danger);}
</style>
</head>
<body>

<div id="sidebar">
  <h1>Mercado Livre Solidário</h1>
  <div class="sub">Rascunho de protótipo — 13 telas</div>
  <div id="nav"></div>
  <div class="log-panel">
    <div class="log-title">Log de eventos (regras de negócio)</div>
    <div id="eventLog"></div>
  </div>
</div>

<div id="main">
  <div id="flowbar">
    <button id="prevBtn">← Anterior</button>
    <span id="flowLabel"></span>
    <button id="nextBtn">Próxima →</button>
  </div>
  <div class="phone">
    <div class="notch"></div>
    <div id="screens"></div>
  </div>
</div>

<script>
const SCREENS = [
  {id:'login', name:'Login', status:'same', group:'Onboarding'},
  {id:'cadastro', name:'Cadastro', status:'edit', group:'Onboarding'},
  {id:'mapa', name:'Mapa compartilhado', status:'edit', group:'Descoberta'},
  {id:'itens', name:'Itens do ponto', status:'same', group:'Descoberta'},
  {id:'publicar-item', name:'Publicar item', status:'new', group:'Publicação'},
  {id:'publicar-necessidade', name:'Publicar necessidade', status:'new', group:'Publicação'},
  {id:'carrinho', name:'Carrinho', status:'edit', group:'Reserva e retirada'},
  {id:'processando', name:'Processando reserva', status:'edit', group:'Reserva e retirada'},
  {id:'qr', name:'QR Code', status:'edit', group:'Reserva e retirada'},
  {id:'confirmacao', name:'Confirmação de retirada', status:'new', group:'Reserva e retirada'},
  {id:'comprovante', name:'Comprovante de doação', status:'new', group:'Reserva e retirada'},
  {id:'perfil', name:'Perfil / Histórico', status:'new', group:'Perfil'},
  {id:'notificacoes', name:'Notificações', status:'new', group:'Perfil'},
];
const STATUS_LABEL = {same:'igual', edit:'ajustada', new:'nova'};

let current = 0;

/* ============================================================
   MOTOR DE ESTADO — simula RN-008 a RN-021
   (disponibilidade, reserva, expiração, confirmação)
   Tudo em memória (sem backend), mas com regras reais:
   reservar de fato baixa o estoque, expirar de fato devolve
   o estoque, confirmar de fato fecha a transação.
   ============================================================ */
const RESERVATION_TTL_MS = 20000; // janela de expiração simulada: 20s

const STATE = {
  items: [
    {id:'it1', name:'Arroz 5kg',   qty:3, urgent:true,  category:'Alimento', point:'Mercado São José'},
    {id:'it2', name:'Feijão 2kg',  qty:5, urgent:false, category:'Alimento', point:'Mercado São José'},
    {id:'it3', name:'Óleo 900ml',  qty:4, urgent:false, category:'Alimento', point:'Mercado São José'},
    {id:'it4', name:'Leite',       qty:2, urgent:true,  category:'Alimento', point:'Mercado São José'},
  ],
  needs: [
    {id:'nd1', name:'Cesta básica', qty:12, urgency:'Alta', inst:'Abrigo Vida Nova'},
  ],
  cart: [],           // [{itemId, qty}]
  reservations: [],   // [{id, items:[{itemId,qty,name}], status, createdAt, expiresAt, point}]
  currentReservationId: null,
  profile: {name:'Gabriel', score:82, history:[]},
  eventLog: [],        // [{time, text, kind}] — evidência das RN em execução
};

function logEvent(text, kind){
  STATE.eventLog.unshift({time: new Date().toLocaleTimeString('pt-BR'), text, kind: kind || 'ok'});
  if(STATE.eventLog.length > 30) STATE.eventLog.pop();
  renderEventLog();
}
function renderEventLog(){
  const el = document.getElementById('eventLog');
  if(!el) return;
  el.innerHTML = STATE.eventLog.length
    ? STATE.eventLog.map(e => `<div class="log-line ${e.kind}"><span class="log-time">${e.time}</span>${e.text}</div>`).join('')
    : `<span class="hint">Nenhum evento ainda — interaja com o carrinho/reserva.</span>`;
}

function findItem(id){ return STATE.items.find(i => i.id === id); }

function selecionarUrgencia(el){
  document.querySelectorAll('#novaNecUrgenciaRow .urgency-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
}

// RN: publicar item entra de fato no estoque compartilhado (aparece na lista de itens)
function publicarItem(){
  const nomeEl = document.getElementById('novoItemNome');
  const qtdEl = document.getElementById('novoItemQtd');
  const urgenteEl = document.getElementById('novoItemUrgente');
  const msgEl = document.getElementById('publicarItemMsg');
  const nome = nomeEl.value.trim();
  const qtd = parseInt(qtdEl.value, 10);
  if(!nome || !qtd || qtd <= 0){
    msgEl.textContent = 'Informe um nome e uma quantidade válida.';
    msgEl.style.color = 'var(--danger)';
    return;
  }
  STATE.items.push({id:'it'+Date.now(), name:nome, qty:qtd, urgent:urgenteEl.checked, category:'Alimento', point:'Mercado São José'});
  nomeEl.value = ''; qtdEl.value = '1'; urgenteEl.checked = false;
  msgEl.textContent = 'Item publicado! Já aparece em "Itens do ponto".';
  msgEl.style.color = 'var(--oferta)';
  renderItens();
  logEvent(`Item publicado: ${nome} (x${qtd})${urgenteEl.checked ? ' — urgente' : ''}.`, 'ok');
}

// RN: publicar necessidade entra na vitrine de necessidades
function publicarNecessidade(){
  const nomeEl = document.getElementById('novaNecNome');
  const qtdEl = document.getElementById('novaNecQtd');
  const selecionada = document.querySelector('#novaNecUrgenciaRow .urgency-opt.selected');
  const msgEl = document.getElementById('publicarNecMsg');
  const nome = nomeEl.value.trim();
  const qtd = parseInt(qtdEl.value, 10);
  if(!nome || !qtd || qtd <= 0 || !selecionada){
    msgEl.textContent = 'Informe o que precisa, a quantidade e o nível de urgência.';
    msgEl.style.color = 'var(--danger)';
    return;
  }
  STATE.needs.push({id:'nd'+Date.now(), name:nome, qty:qtd, urgency:selecionada.dataset.u, inst:'Abrigo Vida Nova'});
  nomeEl.value = ''; qtdEl.value = '1';
  selecionada.classList.remove('selected');
  msgEl.textContent = 'Necessidade publicada! Já aparece na vitrine de necessidades.';
  msgEl.style.color = 'var(--oferta)';
  logEvent(`Necessidade publicada: ${nome} (x${qtd}) — urgência ${selecionada.dataset.u}.`, 'ok');
}

function cartQtyOf(itemId){
  const line = STATE.cart.find(c => c.itemId === itemId);
  return line ? line.qty : 0;
}

// RN: não deixa adicionar mais do que o estoque disponível
function addToCart(itemId){
  const item = findItem(itemId);
  if(!item || item.qty <= cartQtyOf(itemId)) return; // sem disponibilidade
  const line = STATE.cart.find(c => c.itemId === itemId);
  if(line) line.qty += 1; else STATE.cart.push({itemId, qty:1});
  renderItens();
  renderCarrinho();
}
function removeFromCart(itemId){
  const line = STATE.cart.find(c => c.itemId === itemId);
  if(!line) return;
  line.qty -= 1;
  if(line.qty <= 0) STATE.cart = STATE.cart.filter(c => c.itemId !== itemId);
  renderItens();
  renderCarrinho();
}

// RN: um único ponto de doação por reserva (todo o carrinho é sempre do mesmo ponto, já que só há 1 ponto simulado aqui)
// Ferramenta de teste: simula outra pessoa reservando o mesmo item entre o momento
// em que você monta o carrinho e o momento em que confirma — é o único jeito de
// reproduzir de propósito o erro de "falta de estoque na confirmação" (RN de concorrência).
function simularConcorrencia(){
  if(STATE.cart.length === 0) return;
  const linha = STATE.cart[0];
  const item = findItem(linha.itemId);
  if(!item) return;
  item.qty = Math.max(0, item.qty - linha.qty); // outra pessoa "levou" o estoque que você tinha no carrinho
  logEvent(`[Teste] Outro usuário reservou ${item.name} — estoque real caiu, seu carrinho ficou desatualizado.`, 'warn');
  renderCarrinho();
}

function confirmarReserva(){
  if(STATE.cart.length === 0) return;
  goTo(indexOfScreen('processando'));
  showProc('loading');
  setTimeout(() => {
    // RN: disponibilidade é checada de novo no momento da confirmação (concorrência simulada)
    const semEstoque = STATE.cart.some(c => {
      const item = findItem(c.itemId);
      return !item || item.qty < c.qty;
    });
    if(semEstoque){
      showProc('error');
      logEvent('Reserva recusada — estoque insuficiente no momento da confirmação.', 'err');
      return;
    }
    const resItems = STATE.cart.map(c => {
      const item = findItem(c.itemId);
      item.qty -= c.qty; // RN: reserva de fato baixa o estoque
      return {itemId: c.itemId, qty: c.qty, name: item.name};
    });
    const now = Date.now();
    const reservation = {
      id: 'r' + now,
      items: resItems,
      status: 'pending', // pending -> confirmed | expired | cancelled
      createdAt: now,
      expiresAt: now + RESERVATION_TTL_MS,
      point: 'Mercado São José',
    };
    STATE.reservations.push(reservation);
    STATE.currentReservationId = reservation.id;
    STATE.cart = [];
    renderItens();
    renderCarrinho();
    showProc('success');
    logEvent(`Reserva criada: ${resItems.map(i=>i.name+' x'+i.qty).join(', ')} — estoque debitado, expira em ${RESERVATION_TTL_MS/1000}s.`, 'ok');
  }, 900);
}

function currentReservation(){
  return STATE.reservations.find(r => r.id === STATE.currentReservationId) || null;
}

// RN: expiração devolve o estoque — aqui simulada por um botão ("avançar o tempo"),
// já que não dá pra esperar minutos reais dentro de uma demonstração
function expirarReservaAtual(){
  const r = currentReservation();
  if(!r || r.status !== 'pending') return;
  r.status = 'expired';
  r.items.forEach(ri => { const item = findItem(ri.itemId); if(item) item.qty += ri.qty; }); // devolve estoque
  renderItens();
  renderQr();
  logEvent(`Reserva expirada: ${r.items.map(i=>i.name+' x'+i.qty).join(', ')} — estoque devolvido automaticamente.`, 'warn');
}

// RN: doador ou instituição pode cancelar antes da confirmação — devolve o estoque na hora
function cancelarReservaAtual(){
  const r = currentReservation();
  if(!r || r.status !== 'pending') return;
  r.status = 'cancelled';
  r.items.forEach(ri => { const item = findItem(ri.itemId); if(item) item.qty += ri.qty; }); // devolve estoque
  renderItens();
  renderQr();
  logEvent(`Reserva cancelada pelo usuário: ${r.items.map(i=>i.name+' x'+i.qty).join(', ')} — estoque devolvido.`, 'warn');
}

// RN: confirmação é automática ao ler o QR — não existe aprovação humana no meio
function confirmarLeituraQr(){
  const r = currentReservation();
  if(!r){ return; }
  if(r.status !== 'pending'){
    renderQr();
    return;
  }
  r.status = 'confirmed';
  STATE.profile.history.unshift({label: r.items.map(i => i.name).join(', ') + ' — retirado', date: new Date().toLocaleDateString('pt-BR')});
  STATE.profile.score = Math.min(100, STATE.profile.score + 3); // RN: score de confiabilidade sobe a cada retirada confirmada
  goTo(indexOfScreen('confirmacao'));
  renderConfirmacao();
  renderPerfil();
  logEvent(`Retirada confirmada por QR: ${r.items.map(i=>i.name+' x'+i.qty).join(', ')} — score +3.`, 'ok');
}

function renderItens(){
  const grid = document.getElementById('itensGrid');
  if(!grid) return;
  grid.innerHTML = STATE.items.map(item => {
    const disponivel = item.qty - cartQtyOf(item.id);
    const semEstoque = disponivel <= 0;
    return `<div class="item-card">
      ${item.urgent ? '<span class="flag">urgente</span>' : ''}
      <div style="display:flex;flex-direction:column;gap:4px;width:100%;">
        <span>${item.name}</span>
        <span class="hint">${semEstoque ? 'sem estoque' : disponivel + ' disponível(is)'}</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="qty-btn" onclick="removeFromCart('${item.id}')" ${cartQtyOf(item.id)===0?'disabled':''}>−</button>
          <span style="font-size:11px;">${cartQtyOf(item.id)}</span>
          <button class="qty-btn" onclick="addToCart('${item.id}')" ${semEstoque?'disabled':''}>+</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderCarrinho(){
  const linesEl = document.getElementById('cartLines');
  const totalEl = document.getElementById('cartTotal');
  const btnEl = document.getElementById('cartConfirmBtn');
  if(!linesEl) return;
  if(STATE.cart.length === 0){
    linesEl.innerHTML = `<span class="hint">Carrinho vazio — volte aos itens e adicione algo para doar.</span>`;
  } else {
    linesEl.innerHTML = STATE.cart.map(c => {
      const item = findItem(c.itemId);
      return `<div class="cart-line"><span>${item.name}</span><span>x${c.qty}</span></div>`;
    }).join('');
  }
  const total = STATE.cart.reduce((sum, c) => sum + c.qty, 0);
  totalEl.textContent = total;
  btnEl.disabled = total === 0;
}

  // mantém compatível com showProc(); nada extra necessário aqui
}

function renderQr(){
  const r = currentReservation();
  const infoEl = document.getElementById('qrInfo');
  const scanBtn = document.getElementById('qrScanBtn');
  const expireBtn = document.getElementById('qrExpireBtn');
  const cancelBtn = document.getElementById('qrCancelBtn');
  if(!infoEl) return;
  if(!r){
    infoEl.textContent = 'Nenhuma reserva ativa.';
    scanBtn.disabled = true;
    expireBtn.disabled = true;
    cancelBtn.disabled = true;
    return;
  }
  if(r.status === 'expired'){
    infoEl.innerHTML = `<span style="color:var(--danger); font-weight:600;">Reserva expirada — o item voltou a ficar disponível para outras pessoas.</span>`;
    scanBtn.disabled = true;
    expireBtn.disabled = true;
    cancelBtn.disabled = true;
  } else if(r.status === 'cancelled'){
    infoEl.innerHTML = `<span style="color:var(--demanda); font-weight:600;">Reserva cancelada — o item voltou a ficar disponível.</span>`;
    scanBtn.disabled = true;
    expireBtn.disabled = true;
    cancelBtn.disabled = true;
  } else if(r.status === 'confirmed'){
    infoEl.textContent = 'Retirada já confirmada.';
    scanBtn.disabled = true;
    expireBtn.disabled = true;
    cancelBtn.disabled = true;
  } else {
    const restanteS = Math.max(0, Math.round((r.expiresAt - Date.now())/1000));
    infoEl.textContent = `Reserva ativa (${r.items.map(i=>i.name).join(', ')}) — expira em ~${restanteS}s se não for confirmada.`;
    scanBtn.disabled = false;
    expireBtn.disabled = false;
    cancelBtn.disabled = false;
  }
}

function renderConfirmacao(){
  const r = STATE.reservations.slice().reverse().find(x => x.status === 'confirmed');
  const el = document.getElementById('confirmItemsList');
  if(el) el.textContent = r ? r.items.map(i => `${i.name} (x${i.qty})`).join(', ') : '';

function renderComprovante(){
  const r = STATE.reservations.slice().reverse().find(x => x.status === 'confirmed');

}

function buildNav(){
  const nav = document.getElementById('nav');
  let lastGroup = null;
  SCREENS.forEach((s, i) => {
    if(s.group !== lastGroup){
      const label = document.createElement('div');
      label.className = 'group-label';
      label.textContent = s.group;
      nav.appendChild(label);
      lastGroup = s.group;
    }
    const btn = document.createElement('button');
    btn.className = 'nav-item';
    btn.id = 'nav-' + i;
    btn.innerHTML = `<span class="tag ${s.status}">${STATUS_LABEL[s.status]}</span> ${s.name}`;
    btn.onclick = () => goTo(i);
    nav.appendChild(btn);
  });
}

function goTo(i){
  current = i;
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById('screen-' + SCREENS[i].id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('nav-' + i).classList.add('active');
  document.getElementById('flowLabel').textContent = (i+1) + ' / ' + SCREENS.length + ' — ' + SCREENS[i].name;
  document.getElementById('prevBtn').disabled = i === 0;
  document.getElementById('nextBtn').disabled = i === SCREENS.length - 1;
}

    <div class="btn btn-outline">Editar janelas de disponibilidade</div>
  </div>
</div>

<div class="screen" id="screen-notificacoes">
  <div class="screen-inner">
    ${badge('new')}
    <h2 class="screen-title">Notificações</h2>
    <p class="screen-obj">Substitui o contato direto por avisos automáticos.</p>
    <div class="notif"><div class="dot"></div><div class="txt">Necessidade compatível surgiu a 1,2 km de você<div class="time">2h atrás</div></div></div>
    <div class="notif"><div class="dot"></div><div class="txt">Sua reserva foi confirmada — retire até sexta<div class="time">1d atrás</div></div></div>
    <div class="notif"><div class="dot"></div><div class="txt">Comprovante de doação disponível<div class="time">3d atrás</div></div></div>
  </div>
</div>
`;

buildNav();
goTo(0);
renderItens();
renderCarrinho();
renderPerfil();
renderComprovante();
renderEventLog();

// atualiza a contagem regressiva de expiração enquanto a tela de QR estiver ativa
setInterval(() => {
  if(SCREENS[current] && SCREENS[current].id === 'qr'){
    const r = currentReservation();
    if(r && r.status === 'pending' && Date.now() > r.expiresAt){
      expirarReservaAtual();
    } else {
      renderQr();
    }
  }
}, 1000);
</script>

</body>
</html>
